# Do robots.txt and the sitemap describe the site as it actually is?
name: Check SEO files

on:
  push:
    paths:
      - "scripts/check-seo.ts"
      - "src/app/sitemap.ts"
      - "src/app/robots.ts"
      - ".github/workflows/check-seo.yml"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Deployment to check"
        required: false
        default: "https://pinkfly.vercel.app"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:seo -- "${{ inputs.site_url || 'https://pinkfly.vercel.app' }}"
