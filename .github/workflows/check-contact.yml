# Does the contact form deliver? Posts one labelled test message through the
# real endpoint and reports what the route is wired to.
name: Check contact

on:
  push:
    paths:
      - "scripts/check-contact.ts"
      - ".github/workflows/check-contact.yml"
  workflow_dispatch:
    inputs:
      site_url:
        description: "Deployment to check"
        required: false
        default: "https://pinkfly.vercel.app"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contact -- "${{ inputs.site_url || 'https://pinkfly.vercel.app' }}"
