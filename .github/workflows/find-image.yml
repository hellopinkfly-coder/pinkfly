# Locate the document holding an image, when the Studio and the website
# disagree about what it is.
name: Find image

on:
  # Runs on push as well, because a workflow that exists only on a branch
  # cannot be dispatched until it reaches the default branch, and this is
  # needed now rather than after a merge.
  push:
    paths:
      - "scripts/find-image.ts"
      - ".github/workflows/find-image.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Part of the document title to search for"
        required: false
        default: "Bootstrapper"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: npm run find:image -- "${{ inputs.title }}"
