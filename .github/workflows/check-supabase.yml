# Does the newsletter form's Supabase write actually work?
name: Check Supabase

on:
  push:
    paths:
      - "scripts/check-supabase.ts"
      - ".github/workflows/check-supabase.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:supabase
