# Build the site the way the deployment does.
#
# The sandbox this is developed in cannot reach Sanity, so a local build always
# takes the seed-content path and a failure that only happens with real data
# reaches the deployment unseen. CI can reach Sanity, so it builds against the
# live dataset and the failure shows up here first.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
