# Keep the Studio hosted by Sanity in step with the schema in this repo.
#
# The Studio at /studio on the website rebuilds with every Vercel deploy, but
# the copy Sanity hosts is a separate upload that only changes when someone
# runs `sanity deploy` — so it silently kept showing an older schema.
#
# Runs from the `sanity/` folder, which is the Studio root: `sanity.config.ts`
# and `sanity.cli.ts` live there, not beside this repository's package.json.
# Run from the root the CLI cannot resolve its config, and what it uploads is
# a Studio with no schema in it. (There is no `--cwd` flag on `sanity deploy`
# to do this from the root; the working directory is the way.) node_modules
# is installed once at the repository root and `npx` walks up to find it, so
# nothing needs installing twice.
#
# Needs a token that may deploy. It prefers a SANITY_AUTH_TOKEN secret and
# falls back to SANITY_API_WRITE_TOKEN, which the repository already holds.
# A write token is usually NOT enough: deploying needs the `deployStudio`
# grant, which comes with the Deploy Studio role rather than with write
# access. The run says which token it used, and what to do when it is
# refused.
name: Deploy Studio

on:
  push:
    branches: [main]
    paths:
      - "sanity/**"
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        working-directory: sanity
        env:
          DEPLOY_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "Using SANITY_AUTH_TOKEN."
            export SANITY_AUTH_TOKEN="$DEPLOY_TOKEN"
          elif [ -n "$WRITE_TOKEN" ]; then
            echo "SANITY_AUTH_TOKEN is not set; trying SANITY_API_WRITE_TOKEN."
            echo "A write token usually cannot deploy. If this fails with"
            echo "\"missing required grant sanity.project.deployStudio\", create a"
            echo "token with the Deploy Studio role at manage.sanity.io ->"
            echo "API -> Tokens, and add it as the SANITY_AUTH_TOKEN secret."
            export SANITY_AUTH_TOKEN="$WRITE_TOKEN"
          else
            echo "No token available — add SANITY_AUTH_TOKEN as a repository secret."
            exit 1
          fi
          npx sanity deploy
